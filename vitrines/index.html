<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vitrines Wallace – aperçu</title>
<style>
:root{--bg:#10241a;--surface:#183326;--text:#f3ecdc;--muted:#b9c4b4;--accent:#c8402f;--line:#2e4d3c;--r:6px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 "DM Sans","Segoe UI",sans-serif;padding:48px 16px}
main{max-width:960px;margin:0 auto}
h1{font:800 clamp(36px,7vw,64px)/1 "Oswald","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
a.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;color:inherit;text-decoration:none;min-height:180px;transition:transform .2s,border-color .2s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--accent);outline:none}
a.card:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.name{font:700 28px/1.1 "Oswald","Arial Narrow",Impact,sans-serif;text-transform:uppercase}
.addr{color:var(--muted);font-size:14px}
.go{margin-top:auto;display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:700;color:#ff7b68}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Vitrines Wallace</h1>
  <p class="lead">Aperçu des trois vitrines. Cliquez sur une carte pour l’ouvrir.</p>
  <div class="grid">
    <a class="card" href="bar/index.html">
      <span class="tag">Lyon 5e · Vieux-Lyon</span>
      <span class="name">Wallace Bar</span>
      <span class="addr">2 rue Octavio Mey</span>
      <span class="go">Ouvrir la vitrine →</span>
    </a>
    <a class="card" href="snug/index.html">
      <span class="tag">Lyon 2e · Bar à whisky</span>
      <span class="name">Wallace Snug</span>
      <span class="addr">2 rue Thomassin</span>
      <span class="go">Ouvrir la vitrine →</span>
    </a>
    <a class="card" href="pub-vaise/index.html">
      <span class="tag">Lyon 9e · Vaise</span>
      <span class="name">Wallace Pub</span>
      <span class="addr">8 rue de la Claire</span>
      <span class="go">Ouvrir la vitrine →</span>
    </a>
  </div>
</main>
</body>
</html>
